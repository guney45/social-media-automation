[project]
name = "smauto"
version = "0.1.0"
description = "Collect funny posts from X/Instagram/TikTok and turn them into Instagram-ready Reels and feed images."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0.36",
    "typer>=0.15",
    "rich>=13.9",
    "structlog>=24.4",
    "httpx>=0.28",
    "pillow>=11.0",
    "imagehash>=4.3",
    "jinja2>=3.1",
    "playwright>=1.49",
    "anthropic>=0.40",
    "yt-dlp>=2024.12.13",
    "gallery-dl>=1.28",
    "boto3>=1.35",
    "python-dateutil>=2.9",
    "tzdata>=2024.2",
]

[project.scripts]
smauto = "smauto.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
    "respx>=0.22",
    "types-python-dateutil>=2.9",
    "boto3-stubs[s3]>=1.35",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/smauto"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF"]
ignore = [
    "B008",
    "A003",
    # User-facing strings are Turkish; dotless ı and friends are not typos.
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["smauto"]
mypy_path = "src"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["imagehash.*", "gallery_dl.*", "yt_dlp.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
markers = [
    "slow: requires ffmpeg or a real browser",
]
filterwarnings = ["ignore::DeprecationWarning"]
